name: verify

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: windows-latest
    env:
      PGPASSWORD: master_support_ci_only
      MASTER_SUPPORT_TEST_DATABASE_URL: postgresql://postgres:master_support_ci_only@127.0.0.1:5432/master_support_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Provision isolated PostgreSQL
        shell: powershell
        run: |
          choco install postgresql17 --params "'/Password:master_support_ci_only /Port:5432'" --yes --no-progress
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            & 'C:\Program Files\PostgreSQL\17\bin\pg_isready.exe' -h 127.0.0.1 -p 5432 -U postgres
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'PostgreSQL did not become ready.' }
          & 'C:\Program Files\PostgreSQL\17\bin\createdb.exe' -h 127.0.0.1 -U postgres master_support_test
          if ($LASTEXITCODE -ne 0) { throw 'Could not create isolated test database.' }
      - shell: powershell
        run: .\scripts\verify.ps1
